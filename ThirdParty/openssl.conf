# OpenSSL 1.1 for the desktop Qt < 5.15 (see qtmodules.pri): like
# linux-x86_64, but the libraries are libssl.so / libcrypto.so with that
# soname, the names Qt 5.13 asks dlopen for (it is built without OpenSSL
# headers, so it does not know the version suffix). Once preloaded, that
# dlopen gets these instead of the system OpenSSL 3.
my %targets = (
    "atn-linux-x86_64" => {
        inherit_from     => [ "linux-x86_64" ],
        shared_extension => ".so",
    },
);
