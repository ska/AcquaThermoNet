<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 250' width='760' height='250' font-family='Helvetica,Arial,sans-serif' font-size='12'><title>Frost protection cycle</title><rect width='760' height='250' fill='#FFFFFF'/><text x='70.0' y='26.0' text-anchor='start' fill='#1F2937' font-size='13' font-weight='bold'>Frost protection cycle (on_min = 10, period_min = 60)</text><text x='62.0' y='64.0' text-anchor='end' fill='#6B7280' font-size='11' font-weight='normal'>active</text><rect x='70.0' y='50' width='550.0' height='20' rx='3' fill='#DBEAFE' stroke='#2563EB'/><text x='345.0' y='64.0' text-anchor='middle' fill='#2563EB' font-size='11' font-weight='bold'>sensor missing AND outdoor &lt; 6 °C (or unknown)</text><line x1='70.0' y1='150.0' x2='730.0' y2='150.0' stroke='#6B7280' stroke-width='1'/><text x='62.0' y='112.0' text-anchor='end' fill='#AD1625' font-size='11' font-weight='bold'>ON</text><text x='62.0' y='150.0' text-anchor='end' fill='#6B7280' font-size='11' font-weight='bold'>OFF</text><rect x='70.0' y='100' width='36.7' height='50' fill='#AD1625'/><text x='88.3' y='94.0' text-anchor='middle' fill='#AD1625' font-size='10' font-weight='bold'>10 min</text><rect x='290.0' y='100' width='36.7' height='50' fill='#AD1625'/><text x='308.3' y='94.0' text-anchor='middle' fill='#AD1625' font-size='10' font-weight='bold'>10 min</text><rect x='510.0' y='100' width='36.7' height='50' fill='#AD1625'/><text x='528.3' y='94.0' text-anchor='middle' fill='#AD1625' font-size='10' font-weight='bold'>10 min</text><line x1='70.0' y1='158.0' x2='290.0' y2='158.0' stroke='#6B7280' stroke-width='1'/><line x1='70.0' y1='154.0' x2='70.0' y2='162.0' stroke='#6B7280' stroke-width='1'/><text x='180.0' y='174.0' text-anchor='middle' fill='#6B7280' font-size='10' font-weight='normal'>period 60 min</text><line x1='290.0' y1='158.0' x2='510.0' y2='158.0' stroke='#6B7280' stroke-width='1'/><line x1='290.0' y1='154.0' x2='290.0' y2='162.0' stroke='#6B7280' stroke-width='1'/><text x='400.0' y='174.0' text-anchor='middle' fill='#6B7280' font-size='10' font-weight='normal'>period 60 min</text><line x1='510.0' y1='158.0' x2='730.0' y2='158.0' stroke='#6B7280' stroke-width='1'/><line x1='510.0' y1='154.0' x2='510.0' y2='162.0' stroke='#6B7280' stroke-width='1'/><text x='620.0' y='174.0' text-anchor='middle' fill='#6B7280' font-size='10' font-weight='normal'>period 60 min</text><line x1='620.0' y1='45.0' x2='620.0' y2='150.0' stroke='#2563EB' stroke-width='1' stroke-dasharray='3 3'/><text x='730.0' y='26.0' text-anchor='end' fill='#2563EB' font-size='11' font-weight='normal'>end: sensor back or warm outside</text><text x='70.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>0 min</text><text x='180.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>30 min</text><text x='290.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>60 min</text><text x='400.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>90 min</text><text x='510.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>120 min</text><text x='620.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>150 min</text><text x='730.0' y='198.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>180 min</text><text x='380.0' y='240.0' text-anchor='middle' fill='#6B7280' font-size='11' font-weight='normal'>One cycle shared by every protected zone; a new cycle starts ON after a full unused period</text></svg>
