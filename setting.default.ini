; Template: copied to setting.ini at the first start, then edit setting.ini.
; See docs/DOCUMENTATION.md, "Configuration reference".

[MQTT]
; broker host or IP (empty: localhost)
broker_addr=
broker_port=1883
; used only when both are set
broker_uname=
broker_password=
tls=false
ca_file=
cert_file=
key_file=
tls_verify=true
peer_name=

[ZONES]
list=salotto, ingresso, cameretta, camera, bagno
salotto\setpoint=17
ingresso\setpoint=18
cameretta\setpoint=19
camera\setpoint=20
bagno\setpoint=21

[RELAY]
bagno\relaynum=1
ingresso\relaynum=2
cameretta\relaynum=3
camera\relaynum=4
salotto\relaynum=5

[SERIAL]
port=com1
baud=9600

[REGULATION]
min_cycle_s=180
sensor_timeout_s=900

[MODES]
; house mode from the RoomSense panel: windows open (for window_min), away (until normal),
; boost (heat the house quickly, for boost_min)
window_temp=8
window_min=30
away_temp=15
boost_temp=25
boost_min=30

[CHRONO]
; chrono thermostat per zone: <zone>\weekday and <zone>\holiday, up to 8 HH:MM=temp slots
; ("from this time on, this setpoint"); empty holiday = weekday. A manual setpoint lasts
; until the next slot. holiday_days: days of the holiday profile (as VALVE_EXERCISE day).
; Profiles edited on the panel go to state.ini and replace these (Reset: back to these)
holiday_days=saturday, sunday
salotto\enabled=false
salotto\weekday=06:30=20.5, 08:00=18, 17:00=20.5, 22:30=17
salotto\holiday=08:00=20.5, 23:00=17

[FROST_PROTECTION]
enabled=true
outdoor_below=6
on_min=10
period_min=60
outdoor_max_age_min=180
outdoor_unknown_protect=true

[VALVE_EXERCISE]
enabled=true
day=sunday
time=07:00
cycles=3
on_s=60
off_s=60
idle_days=7

[WEATHER]
; metno needs lat and lon (weather disabled without them); contact: e-mail or URL asked by met.no
provider=metno
location=
lat=
lon=
altitude=0
contact=
poll_s=600

[LOG]
file=log/AcquaThermoNet.log
max_kb=512
files=3

[TELEGRAM]
; token from @BotFather, allowed_chats: chat ids, comma separated (docs/TELEGRAM.md)
enabled=false
token=
allowed_chats=
name=AcquaThermoNet
reminder_h=6
mqtt_down_min=10

[RELAY_LOG]
file=log/relays.csv
keep_months=24
